name = "coocheena-stats"
main = "index.js"
compatibility_date = "2024-01-01"

# Daily at 14:00 UTC = 9:00am ET (10:00am EDT during daylight savings)
# Cron format: "minute hour day-of-month month day-of-week"
[triggers]
crons = ["0 14 * * *"]

# Secrets to set after first deploy:
#   wrangler secret put SUPABASE_URL              # https://pmkfrzpyqcgkfujpdkdf.supabase.co
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY # from Supabase Settings → API → service_role
#   wrangler secret put DISCORD_WEBHOOK_URL       # from Discord channel → Integrations → Webhooks
